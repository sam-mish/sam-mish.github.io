title: "Sam Mish"
description: "AI/ML projects, photography, and resume."
url: "https://sam-mish.github.io"
baseurl: ""

author: "Sam Mish"
email: "you@example.com"
github_username: sam-mish

# Custom collection: every file dropped into _projects/ becomes a page
# at /projects/<filename>/ automatically, no template editing needed.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
